<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Province Members - OrdinaTrack</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif'],
          },
          colors: {
            primary: '#2563eb',
            'primary-dark': '#1e40af',
          },
        },
      },
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="../../../Assets/css/dashboard.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gray-50" data-page="province-members">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar w-64 hidden md:flex flex-col">
      <div class="p-6 border-b border-gray-200">
        <h2 class="text-2xl font-bold text-gray-900">OrdinaTrack</h2>
        <p class="text-sm text-gray-600 mt-1">Province Lead</p>
      </div>

      <nav class="flex-1 overflow-y-auto py-4">
        <div class="px-4 mb-4">
          <p class="text-xs font-semibold text-gray-500 uppercase">Dashboard</p>
        </div>

        <a href="../index.html" class="sidebar-link">
          <span class="mr-3">📊</span>
          <span>Overview</span>
        </a>

        <a href="districts.html" class="sidebar-link">
          <span class="mr-3">🗺️</span>
          <span>District Management</span>
        </a>

        <a href="members.html" class="sidebar-link active">
          <span class="mr-3">👥</span>
          <span>Members</span>
        </a>

        <div class="px-4 mt-6 mb-4">
          <p class="text-xs font-semibold text-gray-500 uppercase">Reports</p>
        </div>

        <a href="reports.html" class="sidebar-link">
          <span class="mr-3">📈</span>
          <span>Province Reports</span>
        </a>
      </nav>

      <div class="p-4 border-t border-gray-200">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white font-semibold">P</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-gray-900 truncate" data-lead-name>Province Lead</p>
            <p class="text-xs text-gray-600 truncate" data-province-name>Loading...</p>
          </div>
        </div>
        <button data-action="logout" class="w-full mt-3 px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition">
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto">
      <div class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">Members</h1>
          <p class="text-sm text-gray-600 mt-1">Everyone across <span data-province-name>your province</span></p>
        </div>
        <button id="menu-toggle" class="md:hidden p-2 text-gray-600 hover:bg-gray-100 rounded-lg">☰</button>
      </div>

      <div class="p-8">
        <p id="scope-notice" class="notice hidden mb-6"></p>

        <!-- Filters -->
        <div class="card p-6 mb-6">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
            <div>
              <label class="form-label" for="member-search">Search</label>
              <input type="search" id="member-search" class="form-input w-full" placeholder="Name, email or phone...">
            </div>
            <div>
              <label class="form-label" for="member-district">District</label>
              <select id="member-district" class="form-input w-full">
                <option value="">All districts</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="member-branch">Branch</label>
              <select id="member-branch" class="form-input w-full">
                <option value="">All branches</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="member-role">Role</label>
              <select id="member-role" class="form-input w-full">
                <option value="">All roles</option>
                <option value="Member">Member</option>
                <option value="Steward">Steward</option>
                <option value="Usher">Usher</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="member-status">Status</label>
              <select id="member-status" class="form-input w-full">
                <option value="">All statuses</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Members -->
        <div class="table-container">
          <div id="members-table">
            <div class="p-8 text-center"><div class="loading mx-auto"></div></div>
          </div>
        </div>

        <div class="mt-4 flex items-center justify-between">
          <p class="text-sm text-gray-600" id="members-info"></p>
          <div class="flex gap-2">
            <button class="btn-secondary" id="members-prev">&larr; Previous</button>
            <button class="btn-secondary" id="members-next">Next &rarr;</button>
          </div>
        </div>

        <p class="text-xs text-gray-500 mt-4">
          Members are added and edited by each branch administrator from their own dashboard.
        </p>
      </div>
    </main>
  </div>

  <script src="../../../Assets/js/dashboard-common.js" defer></script>
  <script src="../../../Assets/js/province.js" defer></script>
</body>
</html>
