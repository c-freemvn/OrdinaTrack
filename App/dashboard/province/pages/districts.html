<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>District Management - OrdinaTrack</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif'],
          },
          colors: {
            primary: '#2563eb',
            'primary-dark': '#1e40af',
          },
        },
      },
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="../../../Assets/css/dashboard.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gray-50" data-page="province-districts">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar w-64 hidden md:flex flex-col">
      <div class="p-6 border-b border-gray-200">
        <h2 class="text-2xl font-bold text-gray-900">OrdinaTrack</h2>
        <p class="text-sm text-gray-600 mt-1">Province Lead</p>
      </div>

      <nav class="flex-1 overflow-y-auto py-4">
        <div class="px-4 mb-4">
          <p class="text-xs font-semibold text-gray-500 uppercase">Dashboard</p>
        </div>

        <a href="../index.html" class="sidebar-link">
          <span class="mr-3">📊</span>
          <span>Overview</span>
        </a>

        <a href="districts.html" class="sidebar-link active">
          <span class="mr-3">🗺️</span>
          <span>District Management</span>
        </a>

        <a href="members.html" class="sidebar-link">
          <span class="mr-3">👥</span>
          <span>Members</span>
        </a>

        <div class="px-4 mt-6 mb-4">
          <p class="text-xs font-semibold text-gray-500 uppercase">Reports</p>
        </div>

        <a href="reports.html" class="sidebar-link">
          <span class="mr-3">📈</span>
          <span>Province Reports</span>
        </a>
      </nav>

      <div class="p-4 border-t border-gray-200">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white font-semibold">P</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-gray-900 truncate" data-lead-name>Province Lead</p>
            <p class="text-xs text-gray-600 truncate" data-province-name>Loading...</p>
          </div>
        </div>
        <button data-action="logout" class="w-full mt-3 px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition">
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto">
      <div class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">District Management</h1>
          <p class="text-sm text-gray-600 mt-1">Districts in <span data-province-name>your province</span></p>
        </div>
        <div class="flex items-center gap-3">
          <button id="menu-toggle" class="md:hidden p-2 text-gray-600 hover:bg-gray-100 rounded-lg">☰</button>
          <button id="add-district-btn" class="btn-primary" data-needs-scope>+ Add District</button>
        </div>
      </div>

      <div class="p-8">
        <p id="scope-notice" class="notice hidden mb-6"></p>

        <!-- Filters -->
        <div class="card p-6 mb-6">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="md:col-span-2">
              <label class="form-label" for="district-search">Search</label>
              <input type="search" id="district-search" class="form-input w-full" placeholder="Search by name or code...">
            </div>
            <div>
              <label class="form-label" for="district-status">Status</label>
              <select id="district-status" class="form-input w-full">
                <option value="">All statuses</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Districts -->
        <div class="table-container">
          <div id="districts-table">
            <div class="p-8 text-center"><div class="loading mx-auto"></div></div>
          </div>
        </div>

        <div class="mt-4 flex items-center justify-between">
          <p class="text-sm text-gray-600" id="districts-info"></p>
          <div class="flex gap-2">
            <button class="btn-secondary" id="districts-prev">&larr; Previous</button>
            <button class="btn-secondary" id="districts-next">Next &rarr;</button>
          </div>
        </div>

        <p class="text-xs text-gray-500 mt-4">
          Branches are managed by each district lead from the district dashboard.
        </p>
      </div>
    </main>
  </div>

  <!-- District Modal -->
  <div class="modal" id="district-modal">
    <div class="modal-content">
      <h2 class="text-2xl font-bold text-gray-900 mb-6" id="district-modal-title">Add District</h2>

      <form id="district-form" class="space-y-4" novalidate>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="sm:col-span-2">
            <label class="form-label" for="district-name">District name *</label>
            <input type="text" id="district-name" class="form-input w-full" maxlength="100">
          </div>
          <div>
            <label class="form-label" for="district-code">Code</label>
            <input type="text" id="district-code" class="form-input w-full uppercase" maxlength="10">
          </div>
        </div>

        <div>
          <label class="form-label" for="district-description">Description</label>
          <textarea id="district-description" class="form-input w-full" rows="3"></textarea>
        </div>

        <div>
          <label class="form-label" for="district-active">Status</label>
          <select id="district-active" class="form-input w-full">
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
        </div>

        <p class="text-xs text-gray-500" id="district-admin-note"></p>

        <div class="flex gap-3 pt-2">
          <button type="button" class="btn-secondary flex-1" onclick="closeModal('district-modal')">Cancel</button>
          <button type="submit" class="btn-primary flex-1" id="district-submit-btn">Create District</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Branches of one district (read-only) -->
  <div class="modal" id="branches-modal">
    <div class="modal-content wide">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-gray-900" id="branches-modal-title">Branches</h2>
        <button type="button" class="btn-secondary" onclick="closeModal('branches-modal')">Close</button>
      </div>
      <div class="table-container" id="branches-modal-list"></div>
    </div>
  </div>

  <script src="../../../Assets/js/dashboard-common.js" defer></script>
  <script src="../../../Assets/js/province.js" defer></script>
</body>
</html>
