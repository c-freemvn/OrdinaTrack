<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - OrdinaTrack</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif'],
          },
          colors: {
            primary: '#2563eb',
            'primary-dark': '#1e40af',
          },
        },
      },
    }
  </script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #d9e8f5 100%);
      min-height: 100vh;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Poppins', sans-serif;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(37, 99, 235, 0.2);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 24px;
      max-width: 400px;
      text-align: center;
    }

    .error-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .error-title {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .error-message {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-weight: 600;
      cursor: pointer;
      transition: all 200ms;
      display: inline-block;
      text-decoration: none;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .dashboard-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: #f1f5f9;
      border-radius: 8px;
      cursor: pointer;
      transition: all 200ms;
      text-decoration: none;
      color: #1e293b;
      font-weight: 600;
      border: 1px solid #e2e8f0;
    }

    .dashboard-link:hover {
      background: #e0e7ff;
      border-color: #2563eb;
      color: #2563eb;
    }
  </style>
</head>

<body>
  <div class="loading-container">
    <!-- Loading State -->
    <div id="loadingState" class="card hidden">
      <div class="spinner"></div>
      <p class="text-gray-600 font-medium">Loading your dashboard...</p>
    </div>

    <!-- Error State -->
    <div id="errorState" class="card hidden">
      <div class="error-icon">⚠️</div>
      <div class="error-title">Oops! Something went wrong</div>
      <div class="error-message" id="errorMessage">Unable to redirect to your dashboard. Please try again.</div>
      <div>
        <a href="/OrdinaTrack/App/pages/signin.html" class="btn-primary">Go to Login</a>
      </div>
    </div>

    <!-- Manual Dashboard Selection -->
    <div id="selectionState" class="card hidden">
      <h2 class="text-2xl font-bold text-gray-900 mb-4">Select Your Dashboard</h2>
      <p class="text-gray-600 text-sm mb-6">Choose your role to continue:</p>
      <div class="dashboard-grid">
        <a href="nhq/index.html" class="dashboard-link">
          <span>👤</span>
          <span>NHQ Admin</span>
        </a>
        <a href="province/index.html" class="dashboard-link">
          <span>🗺️</span>
          <span>Province</span>
        </a>
        <a href="district/index.html" class="dashboard-link">
          <span>📍</span>
          <span>District</span>
        </a>
        <a href="branch/index.html" class="dashboard-link">
          <span>🏢</span>
          <span>Branch</span>
        </a>
      </div>
      <div style="margin-top: 20px;">
        <a href="/OrdinaTrack/App/pages/signin.html" class="text-sm text-primary hover:underline">Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    // Configuration for role-based dashboard routing
    const ROLE_DASHBOARD_MAP = {
      'nhq': '/OrdinaTrack/App/dashboard/nhq/index.html',
      'nhq_admin': '/OrdinaTrack/App/dashboard/nhq/index.html',
      'admin': '/OrdinaTrack/App/dashboard/nhq/index.html',
      'province': '/OrdinaTrack/App/dashboard/province/index.html',
      'province_lead': '/OrdinaTrack/App/dashboard/province/index.html',
      'district': '/OrdinaTrack/App/dashboard/district/index.html',
      'district_lead': '/OrdinaTrack/App/dashboard/district/index.html',
      'branch': '/OrdinaTrack/App/dashboard/branch/index.html',
      'branch_admin': '/OrdinaTrack/App/dashboard/branch/index.html',
    };

    const AUTH_CONFIG = {
      TOKEN_KEY: 'auth_token',
      USER_INFO_KEY: 'user_info',
    };

    /**
     * Normalize role string to handle variations
     * @param {string} role - The role to normalize
     * @returns {string} - Normalized role in lowercase
     */
    function normalizeRole(role) {
      if (!role) return null;
      return role.toLowerCase().trim();
    }

    /**
     * Get the dashboard URL for a given role
     * @param {string} role - User's role
     * @returns {string|null} - Dashboard URL or null if role not found
     */
    function getDashboardUrl(role) {
      const normalizedRole = normalizeRole(role);
      return ROLE_DASHBOARD_MAP[normalizedRole] || null;
    }

    /**
     * Initialize dashboard routing
     */
    function initializeDashboard() {
      try {
        // Show loading state
        document.getElementById('loadingState').classList.remove('hidden');

        // Check for authentication token
        const token = localStorage.getItem(AUTH_CONFIG.TOKEN_KEY);
        if (!token) {
          showError('No authentication token found. Please log in to continue.');
          setTimeout(() => {
            window.location.href = '/OrdinaTrack/App/pages/signin.html';
          }, 2000);
          return;
        }

        // Get user info
        const userInfoStr = localStorage.getItem(AUTH_CONFIG.USER_INFO_KEY);
        if (!userInfoStr) {
          showError('User information not found. Please log in again.');
          setTimeout(() => {
            window.location.href = '/OrdinaTrack/App/pages/signin.html';
          }, 2000);
          return;
        }

        let userInfo;
        try {
          userInfo = JSON.parse(userInfoStr);
        } catch (e) {
          console.error('Failed to parse user info:', e);
          showError('Invalid user information. Please log in again.');
          setTimeout(() => {
            window.location.href = '/OrdinaTrack/App/pages/signin.html';
          }, 2000);
          return;
        }

        // Get user's role
        const userRole = userInfo.role;
        if (!userRole) {
          showError('User role not found. Please log in again.');
          setTimeout(() => {
            window.location.href = '/OrdinaTrack/App/pages/signin.html';
          }, 2000);
          return;
        }

        // Get dashboard URL for the role
        const dashboardUrl = getDashboardUrl(userRole);
        if (!dashboardUrl) {
          showError(`Unknown role: ${userRole}. Please contact your administrator.`);
          showManualSelection();
          return;
        }

        // Redirect to role-based dashboard
        console.log(`Redirecting user with role '${userRole}' to dashboard: ${dashboardUrl}`);
        window.location.href = dashboardUrl;

      } catch (error) {
        console.error('Dashboard initialization error:', error);
        showError('An unexpected error occurred. Please try again.');
        showManualSelection();
      }
    }

    /**
     * Show error message
     * @param {string} message - Error message to display
     */
    function showError(message) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('errorMessage').textContent = message;
    }

    /**
     * Show manual dashboard selection
     */
    function showManualSelection() {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.add('hidden');
      document.getElementById('selectionState').classList.remove('hidden');
    }

    /**
     * Handle page visibility - reinitialize when tab becomes active
     */
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        // Page became visible, reinitialize
        const token = localStorage.getItem(AUTH_CONFIG.TOKEN_KEY);
        if (token) {
          initializeDashboard();
        }
      }
    });

    /**
     * Initialize on page load
     */
    document.addEventListener('DOMContentLoaded', function() {
      initializeDashboard();
    });

    /**
     * Fallback initialization if DOMContentLoaded already fired
     */
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeDashboard);
    } else {
      initializeDashboard();
    }
  </script>
</body>
</html>
