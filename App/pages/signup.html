<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=/App/pages/signin.html#signup" />
    <title>Redirecting to Sign Up</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/App/Assets/css/style.css"/>
  </head>
  <body class="auth-shell auth-page">
    <main class="auth-layout">
      <section class="auth-form-panel">
        <div class="auth-card auth-card-main auth-redirect-card">
          <a href="/" class="auth-close-btn" aria-label="Return to landing page"
            >&times;</a
          >
          <h2>Redirecting to sign up...</h2>
          <p>
            If the page does not change automatically, click continue or return
            to the landing page.
          </p>
          <div class="auth-action-row">
            <a href="/App/pages/signin.html#signup" class="btn auth-primary-btn"
              >Continue</a
            >
            <a href="/" class="btn btn-outline-dark auth-secondary-btn"
              >Cancel</a
            >
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
